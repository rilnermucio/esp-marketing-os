name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    name: Verificar commit da tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov "black==26.5.1" flake8

      - name: Rodar suite com cobertura
        run: |
          python -m pytest scripts/tests/ -m "not smoke" -q \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Validar estilo Python
        run: |
          black --check --diff scripts/*.py scripts/hooks/
          flake8 scripts/

      - name: Validar agents e pacote Codex
        run: |
          python scripts/validate_agents.py --strict
          python scripts/build_codex_plugin.py --check
          python scripts/validate_codex_plugin.py plugins/marketing-os

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extrair seção do CHANGELOG para esta versão
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # O changelog canônico usa "## vX.Y.Z (YYYY-MM-DD)". O formato com
          # colchetes continua aceito para preservar compatibilidade histórica.
          NOTES=$(awk -v ver="$VERSION" '
            index($0, "## v" ver " ") == 1 || index($0, "## [" ver "]") == 1 {
              found=1
              next
            }
            found && (/^## v[0-9]/ || /^## \[/) { exit }
            found { print }
          ' CHANGELOG.md | sed '/^---$/d' | sed '/^$/N;/^\n$/d')

          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION: ver CHANGELOG.md para detalhes."
          fi

          # Salva multilinha pra step de output
          echo "notes<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Marketing OS ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            CHANGELOG.md
            README.md
            AGENTS.md
